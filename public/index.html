<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Proxe</title>
		<link rel="icon" type="image/png" href="proxe.png" />

		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>

		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div class="nebula" aria-hidden="true"></div>
		<main class="home" id="home">
			<img class="logo" src="proxe.png" alt="" />
			<h1>Proxe</h1>
			<p class="tag">Browse anything, right from Proxe.</p>
			<form id="sj-form" role="search">
				<input id="sj-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden" />
				<input id="sj-address" type="text" placeholder="Search or type a web address" aria-label="Search or type a web address" autocomplete="off" spellcheck="false" />
				<button type="submit">Go</button>
			</form>
			<p id="sj-loading" class="loading" hidden><span class="spin" aria-hidden="true"></span>Loading&hellip;</p>
			<p id="sj-error" role="alert"></p>
			<pre id="sj-error-code"></pre>
		</main>
		<footer>
			<span>&copy; Proxe</span>
			<a href="https://github.com/Dakilla2200/Scramjet-App" title="Source code (AGPL-3.0)">Source</a>
			<a href="credits.html" title="License information">Credits</a>
		</footer>
	</body>
</html>
